[package]
name = "cloudweave-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cloudweave-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest-blocking", "rustls-tls", "timing-resistant-secret-traits"] }
url = "=2.5.8"
webbrowser = "=1.0.6"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
hex = "=0.4.3"
fs2 = "=0.4.3"
httpdate = "=1.0.3"

[dev-dependencies]
tempfile = "=3.27.0"
